name: Backfill B.League/WKBL players
# bleague-players 브랜치에서 diag/backfill_bleague.trigger 를 바꿔 푸시하면 실행 → 결과를 같은 브랜치에 커밋
on:
  push:
    branches: [bleague-players]
    paths: ['diag/backfill_bleague.trigger']
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python scripts/backfill_players.py $(cat diag/backfill_bleague.trigger) 2>&1 | tee diag/backfill_bleague.log
      - run: |
          git config user.name backfill-bot; git config user.email backfill@users.noreply.github.com
          git add data diag/backfill_bleague.log
          git commit -m "B리그·WKBL 선수 기록 백필 결과" && git push || echo "변경 없음"
