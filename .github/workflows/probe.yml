name: Probe
on:
  push:
    branches: [probe]
    paths: ['.probe/*.py']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: python .probe/probe.py > .probe/out.txt 2>&1 || true
      - run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git add .probe/out.txt; git commit -m "probe output" && git push
