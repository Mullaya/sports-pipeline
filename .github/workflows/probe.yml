name: Probe (temporary)

on:
  workflow_dispatch:
    inputs:
      script:
        description: '실행할 프로브 스크립트 경로'
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python ${{ github.event.inputs.script }} > scratch_probe/out.txt 2>&1 || true
      - run: |
          git config user.name "probe-bot"
          git config user.email "probe@users.noreply.github.com"
          git add scratch_probe/out.txt
          git commit -m "probe output" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
