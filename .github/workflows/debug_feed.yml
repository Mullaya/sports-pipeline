name: debug flashscore feed
on:
  workflow_dispatch:
    inputs:
      mids:
        description: "comma separated match ids"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests
      - name: probe
        env: {MIDS: "${{ inputs.mids }}"}
        run: |
          python - <<'PY'
          import re, requests, html
          UA={"User-Agent":"Mozilla/5.0"}
          base="https://stats.swehockey.se"
          t=requests.get(base+"/",headers=UA,timeout=30).text
          for m in re.finditer(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',t,re.S):
              txt=re.sub(r"<[^>]+>","",m.group(2)).strip()
              if re.search(r"SHL|Hockeyallsvenskan",txt): print("A",m.group(1),"|",txt[:80])
          ids=re.findall(r'/ScheduleAndResults/Overview/(\d+)',t)
          print("ids",ids[:40])
          for i in ids[:6]:
              for path in (f"/Players/Statistics/LeagueLeaders/{i}",f"/Players/Statistics/Goalkeepers/{i}"):
                  try:
                      r=requests.get(base+path,headers=UA,timeout=30)
                      tt=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",r.text))
                      ti=re.search(r"<title>(.*?)</title>",r.text,re.S)
                      print("P",path,r.status_code,len(r.text),(ti.group(1).strip() if ti else "")[:80])
                      k=tt.find("Goalkeeper")
                      if k>=0: print("   ",tt[k:k+700])
                  except Exception as e: print("P",path,"ERR",e)
          PY
