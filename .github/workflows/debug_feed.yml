name: debug flashscore feed
on:
  workflow_dispatch:
    inputs:
      mids:
        description: "comma separated match ids"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests
      - name: probe
        env: {MIDS: "${{ inputs.mids }}"}
        run: |
          python - <<'PY'
          import re, requests
          UA={"User-Agent":"Mozilla/5.0"}
          base="https://stats.swehockey.se"
          for path in ["/Players/Statistics/LeadingGoalkeepers/20961","/Players/Statistics/LeadingGoalies/20961","/Players/Statistics/GoalkeeperStatistics/20961","/Players/Statistics/ScoringLeaders/20961","/ScheduleAndResults/Schedule/20961"]:
              try:
                  r=requests.get(base+path,headers=UA,timeout=30)
                  tt=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",r.text))
                  print("P",path,r.status_code,len(r.text))
                  for kw in ("SVS%","Sv%","GAA","Goalkeeper","Rk"):
                      k=tt.find(kw)
                      if k>=0: print("   ",kw,"::",tt[max(0,k-200):k+900]); break
                  if "Schedule" in path:
                      print("   games:",re.findall(r'/Game/Events/(\d+)',r.text)[-5:], re.findall(r'href="([^"]*Game[^"]*)"',r.text)[:5])
              except Exception as e: print("P",path,"ERR",e)
          PY
