name: debug flashscore feed
on:
  workflow_dispatch:
    inputs:
      mids:
        description: "date YYYYMMDD"
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q -r requirements.txt || pip install -q requests
      - name: SHL goalie table
        env:
          D: "${{ inputs.mids }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json
          from collectors.goalie_sources import shl_goalie_table
          from uploader.github_uploader import GitHubUploader
          gt = shl_goalie_table(os.environ["D"])
          print(gt["season_id"], len(gt["goalies"]))
          for g in gt["goalies"]: print(g["name"], g["team"], g["gp"], g["sv_pct"], g["gaa"])
          GitHubUploader().upload_json(gt, "SHL", os.environ["D"], "goalies")
          PY
