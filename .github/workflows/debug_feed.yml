name: debug flashscore feed
on:
  workflow_dispatch:
    inputs:
      mids:
        description: "comma separated match ids"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests
      - name: probe
        env: {MIDS: "${{ inputs.mids }}"}
        run: |
          python - <<'PY'
          import re, requests
          UA={"User-Agent":"Mozilla/5.0"}
          base="https://stats.swehockey.se"
          r=requests.get(base+"/Players/Statistics/ScoringLeaders/20961",headers=UA,timeout=30).text
          vals=set(re.findall(r'(?:value|href)="([^"]*(?:Goal|SVS|GAA|Keeper|keeper)[^"]*)"',r))
          print("V",sorted(vals))
          for v in sorted(vals)[:6]:
              u=v if v.startswith("http") else base+("" if v.startswith("/") else "/")+v
              t=requests.get(u,headers=UA,timeout=30).text
              tt=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",t))
              k=tt.find("Last update")
              print("U",u,len(t),"::",tt[k:k+1500] if k>=0 else tt[:200])
          s=requests.get(base+"/ScheduleAndResults/Schedule/20961",headers=UA,timeout=30).text
          print("G",sorted(set(re.findall(r'href="([^"]*(?:Game|Events|Report)[^"]*)"',s)))[-8:])
          print("G2",re.findall(r"openonlinewindow\('([^']+)'",s)[-5:])
          PY
