name: App Data (hourly)

# 분석 앱용 오늘·내일 경기 목록 + 매치업 팩 + 라인업 상태 → data/app/latest.json
# 정각 혼잡 회피를 위해 매시 7분. Claude 동기화 예약 작업은 매시 25분에 이 파일을 가져간다.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      ids:
        description: '라인업을 강제로 다시 확인할 경기 id (쉼표 구분, 비우면 기본 시간창만)'
        required: false
        default: ''
      reason:
        description: '실행 사유 (manual = 픽 데스크 갱신 버튼)'
        required: false
        default: 'manual'

permissions:
  contents: write

concurrency:
  group: app-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 앱 데이터 생성
        run: python app/build_app_data.py
        env:
          FORCE_IDS: ${{ github.event.inputs.ids }}
          RUN_REASON: ${{ github.event.inputs.reason || 'schedule' }}
      - name: 커밋
        run: |
          git config user.name "app-data-bot"
          git config user.email "app-data-bot@users.noreply.github.com"
          git add data/app/latest.json
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "[APP] 경기 목록·매치업 팩 업데이트"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
