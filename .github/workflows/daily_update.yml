name: Daily Sports Data Pipeline

on:
  schedule:
    # 정각(:00)은 Actions 혼잡으로 수 시간 지연이 잦아 분을 비켜 둠 (KST 15:17)
    - cron: '17 6 * * *'
    # KST 08:47 보조 실행 — 정규 실행이 6~10시간 밀려 KHL·리가 전날 경기가 저녁 분석에 빠지는 문제 대응.
    # 북미 리그는 아직 경기 중이므로 COLLECT_SCOPE=eurasia로 KHL·유럽 하키·아시아 리그만 수집
    - cron: '47 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '수집 날짜 YYYYMMDD'
        required: false

permissions:
  contents: write

# 아침 보조 실행이 지연돼 정규 실행과 겹치면 커밋 충돌이 나므로 순차 실행
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 실행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          COLLECT_SCOPE: ${{ github.event.schedule == '47 23 * * *' && 'eurasia' || '' }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python main.py ${{ github.event.inputs.date }}
          else
            python main.py
          fi
      - name: 통계 집계
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python analytics/build_stats.py
      - name: NHL 통계 집계
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # 수집 단계가 API로 커밋한 최신 일별 파일을 반영
          git pull --ff-only origin main || git pull origin main
          python analytics/build_nhl_stats.py
      - name: KBL 통계 집계
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git pull --ff-only origin main || git pull origin main
          python analytics/build_kbl_stats.py KBL
      - name: B리그·WKBL 통계 집계
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git pull --ff-only origin main || git pull origin main
          # 한 리그가 실패해도 다른 리그 집계는 진행하고, 마지막에 실패로 표시
          rc=0
          for lg in BLEAGUE WKBL; do python analytics/build_kbl_stats.py $lg || rc=1; done
          exit $rc
      - name: V-리그(KOVO·WKOVO) 통계 집계
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git pull --ff-only origin main || git pull origin main
          python analytics/build_kovo_stats.py
      - name: 유럽 하키(KHL·DEL·체코·Liiga·SHL) 통계 집계
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git pull --ff-only origin main || git pull origin main
          python analytics/build_hockey_stats.py KHL DEL CZE LIIGA SHL
