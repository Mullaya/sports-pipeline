name: Daily Sports Data Pipeline

on:
  schedule:
    # 정각(:00)은 Actions 혼잡으로 수 시간 지연이 잦아 분을 비켜 둠 (KST 15:17)
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '수집 날짜 YYYYMMDD'
        required: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 실행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python main.py ${{ github.event.inputs.date }}
          else
            python main.py
          fi
      - name: 통계 집계
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python analytics/build_stats.py
      - name: NHL 통계 집계
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # 수집 단계가 API로 커밋한 최신 일별 파일을 반영
          git pull --ff-only origin main || git pull origin main
          python analytics/build_nhl_stats.py
      - name: KBL 통계 집계
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git pull --ff-only origin main || git pull origin main
          python analytics/build_kbl_stats.py
      - name: V-리그(KOVO·WKOVO) 통계 집계
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git pull --ff-only origin main || git pull origin main
          python analytics/build_kovo_stats.py
      - name: 유럽 하키(KHL·DEL·체코) 통계 집계
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git pull --ff-only origin main || git pull origin main
          python analytics/build_hockey_stats.py KHL DEL CZE
      - name: 픽 로그 자동 채점
        run: |
          git pull --ff-only origin main || git pull origin main
          python analytics/grade_picks.py data/picks/picks_log.json data
          if ! git diff --quiet -- data/picks/picks_log.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/picks/picks_log.json
            git commit -m "[PICKS] 픽 로그 자동 채점"
            git push origin HEAD:main
          fi
