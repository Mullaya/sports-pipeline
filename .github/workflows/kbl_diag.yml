name: KBL 대체 수집 실검증 (일회성)
on:
  push:
    branches: [kbl-diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 수집 실행
        run: |
          mkdir -p diag/kbl
          python - <<'PY'
          import json, time
          from collectors.kbl_collector import KBLCollector
          c = KBLCollector()
          t = time.time()
          for d in ["20261020","20261021","20261022","20261023","20261024","20261025","20261026","20261027","20261028"]:
              out = c.collect_daily(d)
              json.dump(out, open(f"diag/kbl/{d}.json", "w"), ensure_ascii=False, indent=1)
              print(d, out.get("source", "naver"), len(out["games"]))
          print("elapsed", round(time.time() - t))
          PY
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -m "diag kbl result" && git push origin HEAD:kbl-diag
